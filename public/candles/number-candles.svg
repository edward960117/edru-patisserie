<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="200" fill="#f5f5f5" rx="8"/>
  
  <!-- Number shaped candles -->
  <!-- Candle "2" shape -->
  <defs>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE66D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Large number "2" -->
  <path d="M 25 60 Q 25 50 35 50 Q 45 50 45 60 Q 45 70 30 75 L 45 75 Q 45 85 35 90 Q 25 90 25 80" 
        fill="url(#numGrad)" stroke="#E6B800" stroke-width="0.5" stroke-linejoin="round"/>
  
  <!-- Number "5" -->
  <path d="M 60 50 L 75 50 Q 80 50 80 55 Q 80 60 70 62 Q 85 62 85 72 Q 85 85 70 85 Q 60 85 60 75 L 70 75 Q 75 75 75 72 Q 75 65 65 65 L 65 55 Q 75 55 75 60" 
        fill="url(#numGrad)" stroke="#E6B800" stroke-width="0.5" stroke-linejoin="round"/>
  
  <!-- Base/Stand -->
  <rect x="20" y="95" width="65" height="50" fill="url(#numGrad)" rx="3" stroke="#E6B800" stroke-width="0.5" opacity="0.8"/>
  
  <!-- Wick representation -->
  <rect x="35" y="85" width="3" height="12" fill="#333" rx="1.5"/>
  <rect x="70" y="85" width="3" height="12" fill="#333" rx="1.5"/>
  
  <!-- Flames -->
  <path d="M 36.5 82 Q 34 76 35 68 Q 36.5 74 38 68 Q 39 76 36.5 82" fill="#FFD700" opacity="0.9"/>
  <path d="M 71.5 82 Q 69 76 70 68 Q 71.5 74 73 68 Q 74 76 71.5 82" fill="#FFD700" opacity="0.9"/>
  
  <!-- Text label -->
  <text x="60" y="185" font-size="11" text-anchor="middle" fill="#666" font-family="Arial" font-weight="bold">Number Candles</text>
</svg>